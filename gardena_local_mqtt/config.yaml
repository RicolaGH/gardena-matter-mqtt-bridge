name: GARDENA Local MQTT (Preview)
version: "0.1.1"
slug: gardena_local_mqtt
description: Lokale Sensoren und Mähersteuerung direkt in Home Assistant. Ohne Gateway-Bridge-Download.
url: https://github.com/RicolaGH/gardena-matter-mqtt-bridge
arch: [aarch64, amd64]
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-mower
panel_title: GARDENA Local MQTT
options:
  gateway_host: ""
  device_id: ""
  mqtt_broker_host: ""
  mqtt_broker_port: 1883
  mqtt_broker_user: ""
  mqtt_broker_password: ""
  mqtt_topic_prefix: gardena
  mqtt_ha_prefix: homeassistant
schema:
  gateway_host: str
  device_id: password
  mqtt_broker_host: str
  mqtt_broker_port: int(1,65535)
  mqtt_broker_user: str
  mqtt_broker_password: password?
  mqtt_topic_prefix: str
  mqtt_ha_prefix: str
