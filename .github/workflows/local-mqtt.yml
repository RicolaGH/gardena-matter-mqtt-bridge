name: Local MQTT app
on:
  pull_request:
  push:
    branches: [main, feat/local-mqtt-app, fix/gateway-autonomous-runtime]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s gardena_local_mqtt/tests -v
      - run: python3 -m compileall -q gardena_local_mqtt
      - run: bash -n gardena_local_mqtt/run.sh
  image:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build -t gardena-local-test gardena_local_mqtt
      - run: docker run --rm --entrypoint python3 gardena-local-test -c 'import app, worker, telemetry, gateway, protocol'
      - name: Execute gateway binary under MIPS emulation
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          docker create --name gateway-export gardena-local-test
          docker cp gateway-export:/opt/gardena-local/gardena-local-gateway ./gardena-local-gateway
          docker rm gateway-export
          file gardena-local-gateway
          qemu-mipsel ./gardena-local-gateway -version
