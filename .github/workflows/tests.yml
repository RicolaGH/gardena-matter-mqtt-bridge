name: tests
on:
  pull_request:
  push:
    branches: [main, fix/security-hardening]
permissions:
  contents: read
jobs:
  security-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit and security regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Syntax and whitespace
        run: |
          python3 -m compileall -q gardena_matter_bridge standalone
          find gardena_matter_bridge -name '*.sh' -print0 | xargs -0 -n1 bash -n
          git diff --check
