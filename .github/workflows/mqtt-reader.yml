name: MQTT reader regression
on:
  push:
    branches: [main, test/mqtt-reader]
    paths:
      - 'gardena_local_mqtt/gateway_runtime/**'
      - '.github/workflows/mqtt-reader.yml'
  pull_request:
    paths:
      - 'gardena_local_mqtt/gateway_runtime/**'
      - '.github/workflows/mqtt-reader.yml'
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Repeat transport tests with Go race detection
        run: >-
          docker run --rm -v "$PWD/gardena_local_mqtt/gateway_runtime:/src" -w /src
          golang:1.27.1 go test -race -count=10 -timeout=120s -run '^TestMQTTReader' -v ./...
      - name: Run complete gateway test suite
        run: >-
          docker run --rm -v "$PWD/gardena_local_mqtt/gateway_runtime:/src" -w /src
          golang:1.27.1 go test -timeout=60s -v ./...
